<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="A bb window with the Xcode plugin in place: a live build row above the thread's composer, and a simulator streamed in the side panel">
  <style>
    .fill { animation: fill 2.4s cubic-bezier(.3,.6,.3,1) .4s both; transform-box: fill-box; transform-origin: left center; }
    @keyframes fill { from { transform: scaleX(0) } to { transform: scaleX(1) } }
    .tap { animation: tap 1.2s ease-out 1.1s both; transform-box: fill-box; transform-origin: center; }
    @keyframes tap { 0% { opacity: 0; transform: scale(.4) } 30% { opacity: 1 } 100% { opacity: 0; transform: scale(1.6) } }
    .dot { animation: dot 1.2s ease-out 1.1s both; transform-box: fill-box; transform-origin: center; }
    @keyframes dot { 0% { opacity: 0 } 20% { opacity: 1 } 100% { opacity: 1 } }
    @media (prefers-reduced-motion: reduce) { .fill, .tap, .dot { animation: none } .tap { opacity: 0 } }
  </style>

  <!-- window -->
  <rect x="40" y="40" width="1200" height="480" rx="18" fill="none" stroke="#3d444d" stroke-width="2"/>
  <line x1="40" y1="84" x2="1240" y2="84" stroke="#3d444d" stroke-width="2"/>
  <circle cx="68" cy="62" r="6" fill="#3d444d"/><circle cx="90" cy="62" r="6" fill="#3d444d"/><circle cx="112" cy="62" r="6" fill="#3d444d"/>

  <!-- sidebar: threads, then the Xcode panel at the foot -->
  <line x1="260" y1="84" x2="260" y2="520" stroke="#3d444d" stroke-width="2"/>
  <rect x="68" y="112" width="150" height="8" rx="4" fill="#262c36"/><rect x="68" y="140" width="120" height="8" rx="4" fill="#262c36"/><rect x="68" y="168" width="160" height="8" rx="4" fill="#262c36"/><rect x="68" y="196" width="100" height="8" rx="4" fill="#262c36"/><rect x="68" y="224" width="140" height="8" rx="4" fill="#262c36"/>
  <line x1="60" y1="420" x2="240" y2="420" stroke="#3d444d" stroke-width="2"/>
  <circle cx="92" cy="462" r="21" fill="none" stroke="#c9d1d9" stroke-width="1.5"/>
  <svg x="81" y="451" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#c9d1d9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 13h6"/><path d="M15 13h6"/><path d="M9 11h6v4H9z"/>
  </svg>
  <text x="122" y="467" font-size="15" font-weight="600" fill="#c9d1d9">Xcode</text>

  <!-- thread -->
  <line x1="260" y1="140" x2="900" y2="140" stroke="#3d444d" stroke-width="2"/>
  <rect x="290" y="108" width="180" height="8" rx="4" fill="#262c36"/>
  <rect x="580" y="170" width="280" height="44" rx="12" fill="#262c36"/>
  <rect x="300" y="244" width="420" height="8" rx="4" fill="#262c36"/><rect x="300" y="268" width="360" height="8" rx="4" fill="#262c36"/><rect x="300" y="292" width="300" height="8" rx="4" fill="#262c36"/>

  <!-- the live build row, host-owned, above the composer -->
  <rect x="300" y="352" width="560" height="46" rx="10" fill="none" stroke="#3d444d" stroke-width="2"/>
  <svg x="316" y="365" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#9198a1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 13h6"/><path d="M15 13h6"/><path d="M9 11h6v4H9z"/>
  </svg>
  <text x="346" y="381" font-size="16"><tspan fill="#4493f8">Building</tspan><tspan fill="#c9d1d9" font-weight="600"> App</tspan><tspan fill="#9198a1"> · iPhone 17 Pro · main · compiling</tspan></text>
  <text x="842" y="381" font-size="16" fill="#4493f8" text-anchor="end">8s</text>
  <rect class="fill" x="301" y="394" width="400" height="3" rx="1.5" fill="#4493f8"/>

  <!-- composer -->
  <rect x="300" y="414" width="560" height="76" rx="16" fill="none" stroke="#c9d1d9" stroke-width="2"/>
  <rect x="326" y="440" width="230" height="8" rx="4" fill="#262c36"/>

  <!-- side panel: the simulator, streamed and touchable -->
  <line x1="900" y1="84" x2="900" y2="520" stroke="#3d444d" stroke-width="2"/>
  <text x="926" y="110" font-size="14" font-weight="600" fill="#c9d1d9">iPhone 17 Pro</text>
  <text x="926" y="129" font-size="12" fill="#9198a1">Picked the device this thread last built for.</text>
  <text x="1214" y="110" font-size="13" fill="#9198a1" text-anchor="end">Change</text>

  <rect x="1006" y="152" width="128" height="268" rx="24" fill="none" stroke="#c9d1d9" stroke-width="2"/>
  <rect x="1046" y="164" width="48" height="12" rx="6" fill="#c9d1d9"/>
  <rect x="1024" y="196" width="60" height="8" rx="4" fill="#262c36"/>
  <rect x="1024" y="218" width="92" height="52" rx="8" fill="#262c36"/>
  <rect x="1024" y="284" width="92" height="8" rx="4" fill="#262c36"/><rect x="1024" y="304" width="74" height="8" rx="4" fill="#262c36"/><rect x="1024" y="324" width="84" height="8" rx="4" fill="#262c36"/>
  <rect x="1024" y="372" width="92" height="28" rx="14" fill="none" stroke="#3d444d" stroke-width="2"/>
  <circle class="tap" cx="1070" cy="244" r="20" fill="none" stroke="#4493f8" stroke-width="2"/>
  <circle class="dot" cx="1070" cy="244" r="7" fill="#4493f8" fill-opacity=".35"/>

  <circle cx="936" cy="448" r="5" fill="#3fb950"/>
  <rect x="950" y="444" width="150" height="8" rx="4" fill="#262c36"/>
  <rect x="926" y="472" width="98" height="32" rx="8" fill="none" stroke="#c9d1d9" stroke-width="2"/>
  <text x="975" y="493" font-size="14" font-weight="600" fill="#c9d1d9" text-anchor="middle">Capture</text>
</svg>
